# What `./check` does, on every push and pull request.
#
# Deliberately a thin wrapper around the script rather than a re-listing of the steps. The
# script is the one people run locally, and a CI file that spells the same steps out again is a
# second source of truth that drifts — the failure mode being a green pull request that fails
# the moment someone runs `./check` on their own machine.
#
# Three jobs rather than one, because they need different toolchains and there is no reason for
# a Python failure to hide a TypeScript one. `./check server`, `./check ui` and `./check desktop`
# are the same split the script already offers.
#
# The desktop job is the newest and was missing for a long time, which is how the shell ended up
# being the one package with 63 tests and nothing running them.

name: check

on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch makes the run in progress pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (ruff, format, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches `ruff.toml`'s target-version. The suite uses 3.12+ syntax.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      # `./check` runs `server/.venv/bin/python` by name, so the venv has to exist at that
      # exact path. Creating it is cheaper than teaching the script about two layouts.
      #
      # requirements-dev.txt is where ruff and pytest live. Installing only requirements.txt
      # is what made this job fail with "No module named ruff" on every run from the day it
      # was added — the tools were present on developer machines and declared nowhere.
      - name: Create the venv the checks expect
        run: |
          python -m venv server/.venv
          server/.venv/bin/pip install --quiet --upgrade pip
          server/.venv/bin/pip install --quiet -r server/requirements.txt
          server/.venv/bin/pip install --quiet -r server/requirements-dev.txt

      - run: ./check server

  ui:
    name: ui (tsc, vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      - run: ./check ui

  desktop:
    name: desktop (tsc, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # ubuntu rather than macOS even though the app only ships for macOS: these tests are the
      # shell's own logic — the token file, the SSE reader, the tray menu, the web-view rules —
      # and none of it touches a Mac API. Running them here costs a fraction of a macOS runner
      # minute, and the packaging that genuinely needs macOS is gated by the release workflow.
      - name: Install
        working-directory: desktop
        run: npm ci

      - run: ./check desktop
