<!--
  Sketchpad — a plugin surface, and the shortest honest demonstration of the whole loop.

  He calls `draw`, which lands one record in the plugin's store under `pending`. Core pushes the
  store into this frame. This page folds the record into its own `shapes` list and writes the
  list back. You drag a shape; that writes back too. The next thing you say to him carries the
  digest line, so he knows the sketch has eleven shapes and that you moved one.

  Nothing here fetches anything. There is no network inside the seal, every asset is inlined by
  the server before the document is served, and `window.kith` is the only channel out — with no
  verb that reaches past this plugin's own store.
-->
<div id="chrome">
  <span id="title">Sketchpad</span>
  <span id="count"></span>
  <button id="wipe" type="button">
    <svg class="kith-icon"><use href="#icon-trash" /></svg>
    Clear
  </button>
</div>

<svg id="board" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet"></svg>

<p id="empty">Nothing on it yet. Ask him to draw something.</p>

<style>
  /* The token stylesheet arrives before this one and sets the ground, the font and the form
     controls, so what is left here is only what this surface adds. `--kith-*` rather than
     literal colours: the person can flip the theme while the tab is open and core repaints
     these without remounting the frame. */
  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #chrome {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-bottom: 1px solid var(--kith-line);
    flex: 0 0 auto;
  }
  #title {
    font-weight: 550;
    letter-spacing: -0.01em;
  }
  #count {
    color: var(--kith-dim);
    font-size: 11px;
    margin-right: auto;
  }
  #wipe {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
  }
  #board {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
  }
  #board.empty {
    display: none;
  }
  #board [data-shape] {
    cursor: grab;
  }
  #board [data-shape].held {
    cursor: grabbing;
    opacity: 0.75;
  }
  #empty {
    margin: auto;
    padding: 0 24px;
    text-align: center;
    color: var(--kith-dim);
    font-size: 12px;
  }
  #empty.gone {
    display: none;
  }
</style>

<script>
  (function () {
    var NS = "http://www.w3.org/2000/svg";
    var board = document.getElementById("board");
    var empty = document.getElementById("empty");
    var titleEl = document.getElementById("title");
    var countEl = document.getElementById("count");

    /* What is on the board, and how far through the queue we have got.
     *
     * **`seen` lives in the store, not in this variable, and that was a real bug.** A pane
     * renders only its active tab, so switching tabs unmounts this frame and mounting it again
     * runs this script from the top — with `seen` back at 0 while the queue is still in the
     * store. So every record got folded a second time and the board grew a duplicate of every
     * shape on each visit. Reported as "changing tabs keeps adding empty nodes".
     *
     * A high-water mark is state, and state belongs in the store with everything else. The
     * variable below is only the working copy of what was read back. */
    var shapes = [];
    var seen = 0;
    var title = "Sketchpad";

    var COLOURS = {
      accent: "var(--kith-accent)",
      second: "var(--kith-second)",
      dim: "var(--kith-dim)",
      text: "var(--kith-text)",
    };

    function colour(name) {
      return COLOURS[name] || COLOURS.text;
    }

    function draw() {
      while (board.firstChild) board.removeChild(board.firstChild);
      for (var i = 0; i < shapes.length; i++) render(shapes[i], i);
      var any = shapes.length > 0;
      board.classList.toggle("empty", !any);
      empty.classList.toggle("gone", any);
      titleEl.textContent = title;
      countEl.textContent = any ? shapes.length + (shapes.length === 1 ? " shape" : " shapes") : "";
    }

    function render(shape, index) {
      var group = document.createElementNS(NS, "g");
      group.setAttribute("data-shape", String(index));
      var stroke = colour(shape.colour);

      if (shape.shape === "rect") {
        var rect = document.createElementNS(NS, "rect");
        rect.setAttribute("x", shape.x);
        rect.setAttribute("y", shape.y);
        rect.setAttribute("width", shape.w || 180);
        rect.setAttribute("height", shape.h || 60);
        rect.setAttribute("rx", "8");
        rect.setAttribute("fill", "none");
        rect.setAttribute("stroke", stroke);
        rect.setAttribute("stroke-width", "2");
        group.appendChild(rect);
        var inside = text(shape, stroke);
        if (inside) group.appendChild(inside);
      } else if (shape.shape === "circle") {
        var circle = document.createElementNS(NS, "circle");
        circle.setAttribute("cx", shape.x);
        circle.setAttribute("cy", shape.y);
        circle.setAttribute("r", shape.w || 40);
        circle.setAttribute("fill", "none");
        circle.setAttribute("stroke", stroke);
        circle.setAttribute("stroke-width", "2");
        group.appendChild(circle);
        var caption = text(
          { x: Number(shape.x) - (shape.w || 40), y: Number(shape.y) - (shape.w || 40),
            w: (shape.w || 40) * 2, h: (shape.w || 40) * 2, label: shape.label },
          stroke,
        );
        if (caption) group.appendChild(caption);
      } else if (shape.shape === "line") {
        var line = document.createElementNS(NS, "line");
        line.setAttribute("x1", shape.x);
        line.setAttribute("y1", shape.y);
        line.setAttribute("x2", Number(shape.x) + Number(shape.w || 0));
        line.setAttribute("y2", Number(shape.y) + Number(shape.h || 0));
        line.setAttribute("stroke", stroke);
        line.setAttribute("stroke-width", "2");
        line.setAttribute("stroke-linecap", "round");
        group.appendChild(line);
      } else {
        // Bare text: no box to fit inside, so it gets its own line box at the point given.
        var loose = text({ shape: shape.shape, x: shape.x, y: shape.y, label: shape.label, colour: shape.colour, w: shape.w || 300, h: shape.h || 40 }, stroke);
        if (loose) group.appendChild(loose);
      }
      board.appendChild(group);
    }

    /* A label that fits its box.
     *
     * **This is what made the board look broken.** The label was one `<text>` at a fixed 20px,
     * so "Review writes NOTHING — trying is not saving" ran straight out through both walls of
     * a 180-wide rect. He writes sentences, not words, and a diagram whose labels overflow
     * their shapes reads as a bug however correct the geometry is.
     *
     * Wrapped to the box and shrunk until it fits, with a floor: past that the honest answer is
     * a wider shape, not four-point type. No measuring API is needed — an average glyph in this
     * face is close enough to 0.55em that a character count is a better estimate than anything
     * that would justify a reflow pass.
     */
    function text(shape, stroke) {
      var words = String(shape.label || "").split(/\s+/).filter(Boolean);
      if (!words.length) return null;

      var width = Number(shape.w || 180);
      var height = Number(shape.h || 60);
      var size = 20;
      var lines = [];

      while (size >= 9) {
        lines = wrap(words, Math.max(1, Math.floor(width / (size * 0.55)) - 1));
        if (lines.length * size * 1.25 <= height - 8) break;
        size -= 2;
      }

      var block = document.createElementNS(NS, "text");
      block.setAttribute("x", Number(shape.x) + width / 2);
      block.setAttribute("text-anchor", "middle");
      block.setAttribute("fill", stroke);
      block.setAttribute("font-size", String(size));
      // Centred as a block: the first line sits half the block's height above the middle, so
      // two lines straddle the centre rather than starting at it.
      var top = Number(shape.y) + height / 2 - ((lines.length - 1) * size * 1.25) / 2 + size / 3;
      for (var i = 0; i < lines.length; i++) {
        var line = document.createElementNS(NS, "tspan");
        line.setAttribute("x", String(Number(shape.x) + width / 2));
        line.setAttribute("y", String(top + i * size * 1.25));
        line.textContent = lines[i];
        block.appendChild(line);
      }
      return block;
    }

    /** Greedy wrap by character budget. A long single word is broken rather than left to
     *  overflow, because one unbreakable word is exactly the case that looks worst. */
    function wrap(words, budget) {
      var lines = [];
      var line = "";
      for (var i = 0; i < words.length; i++) {
        var word = words[i];
        while (word.length > budget) {
          if (line) {
            lines.push(line);
            line = "";
          }
          lines.push(word.slice(0, budget));
          word = word.slice(budget);
        }
        if (!line) line = word;
        else if ((line + " " + word).length <= budget) line += " " + word;
        else {
          lines.push(line);
          line = word;
        }
      }
      if (line) lines.push(line);
      // Four lines in a box is already dense; past that the shape is the wrong size and
      // silently dropping the rest is better than a wall of type spilling out of it.
      return lines.slice(0, 4);
    }

    /* Dragging, which is the half he cannot see happen.
     *
     * A shape moved here writes straight back into the plugin's store, so the next message
     * carries it in the digest and he does not have to ask whether anything moved. */
    var held = null;
    board.addEventListener("pointerdown", function (event) {
      var group = event.target.closest("[data-shape]");
      if (!group) return;
      var box = board.getBoundingClientRect();
      held = {
        index: Number(group.getAttribute("data-shape")),
        group: group,
        scale: 1000 / Math.min(box.width, box.height),
        from: { x: event.clientX, y: event.clientY },
      };
      group.classList.add("held");
      board.setPointerCapture(event.pointerId);
    });
    board.addEventListener("pointermove", function (event) {
      if (!held) return;
      var dx = (event.clientX - held.from.x) * held.scale;
      var dy = (event.clientY - held.from.y) * held.scale;
      held.group.setAttribute("transform", "translate(" + dx + "," + dy + ")");
      held.moved = { dx: dx, dy: dy };
    });
    board.addEventListener("pointerup", function (event) {
      if (!held) return;
      var moved = held.moved;
      var index = held.index;
      held.group.classList.remove("held");
      held = null;
      try {
        board.releasePointerCapture(event.pointerId);
      } catch (e) {}
      if (!moved || (Math.abs(moved.dx) < 2 && Math.abs(moved.dy) < 2)) return;
      var shape = shapes[index];
      if (!shape) return;
      shape.x = Math.round(Math.max(0, Math.min(1000, Number(shape.x) + moved.dx)));
      shape.y = Math.round(Math.max(0, Math.min(1000, Number(shape.y) + moved.dy)));
      commit("moved " + (shape.label || shape.shape));
      draw();
    });

    document.getElementById("wipe").addEventListener("click", function () {
      shapes = [];
      commit("cleared");
      draw();
    });

    /* The one call out. `shapes` is the list, and `note` is a short phrase for the digest — both
     * are keys the manifest declared, so they are the only two this can reach. */
    function commit(note) {
      window.kith.state.set({
        shapes: shapes,
        note: note,
        title: title,
        // Written with the shapes it accounts for, in one message, so the two cannot disagree.
        // A `seen` that survived without its shapes would silently drop a record; shapes that
        // survived without their `seen` would duplicate every one of them.
        seen: seen,
      });
    }

    /* Core pushes the whole store whenever it changes, and this is the only inbound data path.
     *
     * `pending` is where a `draw` or `clear` call lands. Folding it here rather than server-side
     * is what makes the surface the authority on its own picture: the model says "add a rect at
     * 100,100", and what that *means* for the drawing is this page's business. */
    window.kith.render(function (state) {
      if (Array.isArray(state.shapes)) shapes = state.shapes.slice();
      if (typeof state.title === "string" && state.title) title = state.title;
      // Read back before folding, so a remount picks up where the last one left off rather
      // than at zero. `Math.max` because a push can arrive while a write is still in flight,
      // and going backwards here would re-fold what we just folded.
      if (typeof state.seen === "number") seen = Math.max(seen, state.seen);

      /* `pending` is a queue, and every record newer than `seen` is folded in order.
       *
       * It was one slot for a while, which lost sixteen of seventeen shapes: each call
       * overwrote the last, and this page is only told when the host pushes — so it saw the
       * newest record and nothing before it. A queue plus a high-water mark means the tab can
       * be shut for a whole turn and still be right when it opens. */
      var queued = Array.isArray(state.pending) ? state.pending : [];
      var folded = null;
      for (var q = 0; q < queued.length; q++) {
        var record = queued[q];
        if (!record || typeof record !== "object" || Number(record.seq || 0) <= seen) continue;
        seen = Number(record.seq);
        folded = record;
        if (record.command === "clear") {
          shapes = [];
        } else if (record.command === "draw" && record.args) {
          var drawn = {
            shape: record.args.shape,
            x: record.args.x,
            y: record.args.y,
            w: record.args.w,
            h: record.args.h,
            label: record.args.label,
            colour: record.args.colour,
          };
          // A record with no shape and no label is not a node, and drawing one produces the
          // stray empty box that made this look broken even once the duplication was fixed.
          if (drawn.shape || drawn.label) shapes.push(drawn);
        }
      }
      /* One write for the whole batch rather than one per record — seventeen draws in a turn
       * would otherwise be seventeen round trips, each one invalidating the query that pushed
       * the next. */
      if (folded) {
        commit(
          folded.command === "clear"
            ? "cleared"
            : "drew " + (folded.args.label || folded.args.shape),
        );
      }
      draw();
    });

    draw();
  })();
</script>
